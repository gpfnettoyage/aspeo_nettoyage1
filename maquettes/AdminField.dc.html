<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
    <label style="font-size:14px;font-weight:500;color:#0a0a0a;line-height:1.35">{{ f.label }}<sc-if value="{{ f.req }}"><span style="color:#c2410c"> *</span></sc-if></label>
    <sc-if value="{{ f.hasCounter }}"><span style="font-size:12px;color:{{ f.counterColor }};font-variant-numeric:tabular-nums;white-space:nowrap">{{ f.counter }}</span></sc-if>
  </div>

  <sc-if value="{{ f.isText }}">
    <input type="text" value="{{ f.value }}" onInput="{{ f.onInput }}" placeholder="{{ f.placeholder }}" style="width:100%;padding:8px 10px;border:1px solid #e5e7eb;border-radius:6px;font:inherit;font-size:14px;color:#0a0a0a;background:#fff;outline:none" style-focus="border-color:#06226D;box-shadow:0 0 0 3px rgba(6,34,109,.14)">
  </sc-if>

  <sc-if value="{{ f.isTextarea }}">
    <textarea rows="{{ f.rows }}" value="{{ f.value }}" onInput="{{ f.onInput }}" placeholder="{{ f.placeholder }}" style="width:100%;padding:8px 10px;border:1px solid #e5e7eb;border-radius:6px;font:inherit;font-size:14px;line-height:1.5;color:#0a0a0a;background:#fff;resize:vertical;outline:none" style-focus="border-color:#06226D;box-shadow:0 0 0 3px rgba(6,34,109,.14)"></textarea>
  </sc-if>

  <sc-if value="{{ f.isRich }}">
    <div style="border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;background:#fff">
      <div style="display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid #e5e7eb;background:#fafafa">
        <button type="button" aria-label="Gras" style="min-width:30px;height:28px;border:none;border-radius:4px;background:none;font-weight:700;cursor:pointer;color:#3f3f46" style-hover="background:#ececee">B</button>
        <button type="button" aria-label="Italique" style="min-width:30px;height:28px;border:none;border-radius:4px;background:none;font-style:italic;cursor:pointer;color:#3f3f46" style-hover="background:#ececee">I</button>
        <button type="button" aria-label="Sous-titre" style="min-width:30px;height:28px;border:none;border-radius:4px;background:none;font-weight:600;font-size:12px;cursor:pointer;color:#3f3f46" style-hover="background:#ececee">H2</button>
        <button type="button" aria-label="Liste" style="min-width:30px;height:28px;border:none;border-radius:4px;background:none;cursor:pointer;color:#3f3f46" style-hover="background:#ececee">•</button>
        <button type="button" aria-label="Lien" style="padding:0 8px;height:28px;border:none;border-radius:4px;background:none;font-size:12.5px;cursor:pointer;color:#3f3f46" style-hover="background:#ececee">Lien</button>
      </div>
      <textarea rows="{{ f.rows }}" value="{{ f.value }}" onInput="{{ f.onInput }}" placeholder="{{ f.placeholder }}" style="width:100%;display:block;padding:10px 12px;border:none;font:inherit;font-size:14px;line-height:1.6;color:#0a0a0a;background:#fff;resize:vertical;outline:none"></textarea>
    </div>
  </sc-if>

  <sc-if value="{{ f.isSelect }}">
    <select value="{{ f.value }}" onChange="{{ f.onInput }}" style="width:100%;padding:8px 10px;border:1px solid #e5e7eb;border-radius:6px;font:inherit;font-size:14px;color:#0a0a0a;background:#fff;outline:none" style-focus="border-color:#06226D;box-shadow:0 0 0 3px rgba(6,34,109,.14)">
      <sc-for list="{{ f.options }}" as="o" hint-placeholder-count="3">
        <option value="{{ o.value }}">{{ o.label }}</option>
      </sc-for>
    </select>
  </sc-if>

  <sc-if value="{{ f.isChips }}">
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <sc-for list="{{ f.chips }}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{ c.toggle }}" style="border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;line-height:1.3">{{ c.label }}</button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ f.isToggle }}">
    <button type="button" role="switch" aria-checked="{{ f.on }}" onClick="{{ f.flip }}" style="display:inline-flex;align-items:center;gap:10px;background:none;border:none;padding:2px 0;cursor:pointer;font:inherit;color:#0a0a0a;align-self:flex-start;text-align:left">
      <span style="position:relative;width:38px;height:22px;border-radius:999px;background:{{ f.swBg }};transition:background .15s;flex:none"><span style="position:absolute;top:2px;left:{{ f.knob }};width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s"></span></span>
      <span style="font-size:14px">{{ f.toggleLabel }}</span>
    </button>
  </sc-if>

  <sc-if value="{{ f.isImage }}">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="width:120px;aspect-ratio:4/3;border-radius:6px;border:1px solid #e5e7eb;background-color:{{ f.thumbBg }};background-image:url('{{ f.imgUrl }}');background-position:center;background-size:{{ f.thumbFit }};background-repeat:no-repeat;background-origin:content-box;padding:{{ f.thumbPad }};flex:none"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" onClick="{{ f.pickImage }}" style="border:1px solid #e5e7eb;background:#fff;color:#0a0a0a;border-radius:6px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer" style-hover="background:#f4f4f5">{{ f.pickLabel }}</button>
        <sc-if value="{{ f.hasImg }}"><button type="button" onClick="{{ f.clearImage }}" style="border:none;background:none;color:#6b7280;border-radius:6px;padding:7px 10px;font:inherit;font-size:13.5px;cursor:pointer" style-hover="background:#f4f4f5;color:#0a0a0a">Retirer</button></sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ f.isPairs }}">
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ f.pairs }}" as="r" hint-placeholder-count="2">
        <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 34px;gap:8px;align-items:center">
          <input type="text" value="{{ r.a }}" onInput="{{ r.onA }}" placeholder="{{ f.pairA }}" aria-label="{{ f.pairA }}" style="width:100%;padding:8px 10px;border:1px solid #e5e7eb;border-radius:6px;font:inherit;font-size:14px;color:#0a0a0a;background:#fff;outline:none" style-focus="border-color:#06226D;box-shadow:0 0 0 3px rgba(6,34,109,.14)">
          <input type="text" value="{{ r.b }}" onInput="{{ r.onB }}" placeholder="{{ f.pairB }}" aria-label="{{ f.pairB }}" style="width:100%;padding:8px 10px;border:1px solid #e5e7eb;border-radius:6px;font:inherit;font-size:14px;color:#0a0a0a;background:#fff;outline:none" style-focus="border-color:#06226D;box-shadow:0 0 0 3px rgba(6,34,109,.14)">
          <button type="button" onClick="{{ r.remove }}" aria-label="Supprimer la ligne" style="width:34px;height:34px;border:none;background:none;border-radius:6px;color:#6b7280;font-size:18px;cursor:pointer" style-hover="background:#fef2f2;color:#dc2626">×</button>
        </div>
      </sc-for>
      <button type="button" onClick="{{ f.addPair }}" style="align-self:flex-start;border:1px dashed #d4d4d8;background:#fff;color:#3f3f46;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer" style-hover="border-color:#06226D;color:#06226D">+ Ajouter une ligne</button>
    </div>
  </sc-if>

  <sc-if value="{{ f.hasHelp }}"><p style="margin:0;font-size:12.5px;color:#6b7280;line-height:1.45">{{ f.help }}</p></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:120},&quot;f&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
