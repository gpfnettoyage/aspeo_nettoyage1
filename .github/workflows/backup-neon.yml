name: Daily Neon DB Backup

on:
  schedule:
    # Tous les jours à 3h du matin UTC (4h Paris en hiver, 5h en été)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permet de lancer manuellement

env:
  NEON_API_KEY: ${{ secrets.NEON_API_KEY_BACKUP }}
  NEON_PROJECT_ID: still-dust-01159926
  NEON_MAIN_BRANCH_ID: br-wandering-field-alwjcdob
  MAX_BACKUPS: 5

jobs:
  backup:
    name: Create Neon Branch Backup
    runs-on: ubuntu-latest

    steps:
      - name: Validate API Key
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "❌ ERROR: NEON_API_KEY_BACKUP secret is not set!"
            echo "Please add it in GitHub Settings > Secrets and variables > Actions"
            echo ""
            echo "To get your API key:"
            echo "1. Go to https://console.neon.tech/app/settings/api-keys"
            echo "2. Create a new API key"
            echo "3. Add it as NEON_API_KEY_BACKUP in your repo secrets"
            exit 1
          fi
          echo "✅ API Key is configured"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Check if backup already exists for today
        id: check-existing
        run: |
          echo "Checking for existing backup branch..."

          BRANCHES=$(curl -s -X GET \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY")

          EXISTING=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "backup-${{ steps.date.outputs.date }}") | .id')

          if [ -n "$EXISTING" ]; then
            echo "⚠️ Backup for today already exists, skipping creation"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No existing backup for today"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup old backup branches (enforce max ${{ env.MAX_BACKUPS }})
        # Always runs — ensures limit is respected even when skipping creation
        run: |
          echo "Enforcing max $MAX_BACKUPS backup branches..."

          BRANCHES=$(curl -s -X GET \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY")

          # Sort from oldest to newest by name (name = backup-YYYY-MM-DD)
          BACKUP_BRANCHES=$(echo "$BRANCHES" | jq -r '[.branches[] | select(.name | startswith("backup-"))] | sort_by(.name) | .[] | "\(.id) \(.name)"')
          BACKUP_COUNT=$(echo "$BRANCHES" | jq '[.branches[] | select(.name | startswith("backup-"))] | length')
          echo "Current backup count: $BACKUP_COUNT / $MAX_BACKUPS"

          # If today's backup doesn't exist yet, reserve a slot for it
          if [ "${{ steps.check-existing.outputs.exists }}" = "false" ]; then
            KEEP=$((MAX_BACKUPS - 1))
          else
            KEEP=$MAX_BACKUPS
          fi

          TO_DELETE=$((BACKUP_COUNT - KEEP))

          if [ "$TO_DELETE" -le 0 ]; then
            echo "✅ No cleanup needed"
          else
            echo "🗑️ Deleting $TO_DELETE old backup(s)..."

            echo "$BACKUP_BRANCHES" | head -n "$TO_DELETE" | while IFS= read -r LINE; do
              [ -z "$LINE" ] && continue
              BRANCH_ID=$(echo "$LINE" | awk '{print $1}')
              BRANCH_NAME=$(echo "$LINE" | awk '{print $2}')

              echo "  Deleting: $BRANCH_NAME ($BRANCH_ID)..."

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
                -H "Authorization: Bearer $NEON_API_KEY")

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "  ✅ Deleted $BRANCH_NAME"
              else
                echo "  ⚠️ Failed to delete $BRANCH_NAME (HTTP $HTTP_CODE)"
              fi
            done
          fi

      - name: Create backup branch
        if: steps.check-existing.outputs.exists == 'false'
        id: create-branch
        run: |
          echo "Creating backup branch for ${{ steps.date.outputs.date }}..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": {
                "name": "backup-${{ steps.date.outputs.date }}",
                "parent_id": "'$NEON_MAIN_BRANCH_ID'"
              }
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            BRANCH_ID=$(echo "$BODY" | jq -r '.branch.id // empty')
            if [ -n "$BRANCH_ID" ]; then
              echo "✅ Backup branch created: $BRANCH_ID"
              echo "branch_id=$BRANCH_ID" >> $GITHUB_OUTPUT
            else
              echo "❌ Branch created but no ID returned"
              echo "$BODY" | jq .
              exit 1
            fi
          else
            echo "❌ Failed to create branch (HTTP $HTTP_CODE)"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
            exit 1
          fi

      - name: List current backup branches
        id: list-branches
        run: |
          BRANCHES=$(curl -s -X GET \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY")

          echo "📋 Current backup branches:"
          echo "$BRANCHES" | jq -r '[.branches[] | select(.name | startswith("backup-"))] | sort_by(.name) | reverse | .[] | "  - \(.name)"'

          BACKUP_COUNT=$(echo "$BRANCHES" | jq '[.branches[] | select(.name | startswith("backup-"))] | length')
          echo ""
          echo "Total backup branches: $BACKUP_COUNT / $MAX_BACKUPS"
          echo "backup_count=$BACKUP_COUNT" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## 🗄️ Neon DB Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Date | ${{ steps.date.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Total Backups | ${{ steps.list-branches.outputs.backup_count }} / ${{ env.MAX_BACKUPS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ Backup existait | ${{ steps.check-existing.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ℹ️ How Neon Branch Backups Work" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branches are **point-in-time snapshots** of your database" >> $GITHUB_STEP_SUMMARY
          echo "- Storage shows **0 KB** because Neon uses copy-on-write (data shared with parent)" >> $GITHUB_STEP_SUMMARY
          echo "- No compute needed for backup storage" >> $GITHUB_STEP_SUMMARY
          echo "- To restore: Add a compute to the backup branch or create a new branch from it" >> $GITHUB_STEP_SUMMARY
