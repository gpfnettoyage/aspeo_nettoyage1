name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  # Dummy values for build/test - real values are in Vercel
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  BETTER_AUTH_SECRET: "test-secret-for-ci-only-32-chars-minimum"
  BETTER_AUTH_URL: "http://localhost:3000"
  # Redis/KV for rate limiting (unit tests: unavailable, fails gracefully with CI=true; E2E: real Redis service)
  KV_REST_API_URL: "http://localhost:6379"
  KV_REST_API_TOKEN: "fake-kv-token-for-ci"
  # Email (dummy values for CI)
  OVH_EMAIL_USER: "test@example.com"
  OVH_EMAIL_PASS: "fake-password-for-ci"
  # Public URL
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test  # Run after unit tests pass

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis réel + API REST compatible Upstash : sans lui, chaque appel Redis de la
      # connexion attend les relances du client Upstash (> 15 s) et les tests expirent.
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      upstash:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: fake-kv-token-for-ci
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    env:
      KV_REST_API_URL: "http://localhost:8079"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup database schema
        run: npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: npm run build

      - name: Start server and run E2E tests
        run: |
          echo "Waiting for Upstash-compatible Redis..."
          for i in {1..30}; do
            if curl -sf -X POST -H "Authorization: Bearer $KV_REST_API_TOKEN" -d '["PING"]' "$KV_REST_API_URL" > /dev/null; then
              echo "Redis is ready!"
              break
            fi
            sleep 2
          done
          npm start &
          SERVER_PID=$!
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done
          npm run test:e2e
          kill $SERVER_PID 2>/dev/null || true
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true  # Type errors from node_modules

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --max-warnings=0 || true
